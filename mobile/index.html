<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Fabrique à Voyages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=DM+Serif+Display&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

<script type="module">
  async function bootMobileApp() {
    try {
      window.SB = await import('./lib/supabase.js');
    } catch (error) {
      console.error('Supabase mobile import failed:', error);
      window.SB = null;
    }

    window.dispatchEvent(new Event('sb-ready'));

    const script = document.createElement('script');
    script.src = 'app.js';
    script.onerror = () => {
      document.getElementById('app').innerHTML = '<p style="padding:24px;font-family:sans-serif">Erreur de chargement app.js</p>';
    };
    document.body.appendChild(script);
  }

  bootMobileApp();
</script>
</body>
</html>
