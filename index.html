<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier - Itinéraire</title>
  <!-- Polices de caractères -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <!-- Feuille de style principale -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BARRE DE NAVIGATION (TOPBAR) -->
  <header class="topbar">
    
    <!-- Logo et Titre -->
    <div class="brand">
      <div class="mark">
        <!-- Icône "route" -->
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.4"></circle>
          <circle cx="18" cy="18" r="2.4"></circle>
          <path d="M8 6h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"></path>
        </svg>
      </div>
      <div class="wordmark">Atelier</div>
    </div>

    <!-- Onglets Itinéraire / Synthèse -->
    <nav class="seg">
      <button class="seg-btn active">Itinéraire</button>
      <button class="seg-btn">Synthèse</button>
    </nav>

    <!-- Actions de droite -->
    <div class="top-right">
      <!-- Espace pour les avatars (on s'en occupera après) -->
      <div class="avatars-placeholder"></div>
      
      <button class="ghost-btn">
        <!-- Icône "map" -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b4843e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4 3 6.6v13.4L9 17.4l6 2.6 6-2.6V4l-6 2.6L9 4z"></path>
          <path d="M9 4v13.4M15 6.6V20"></path>
        </svg>
        Carte
      </button>
    </div>
  </header>

  <!-- ZONE DE CONTENU PRINCIPALE (Le corps de l'appli ira ici) -->
  <!-- ZONE DE CONTENU PRINCIPALE -->
  <main class="main-track-wrapper">
    <div class="track" id="track">
      
      <!-- PANNEAU 1 : ITINÉRAIRE -->
      <div class="panel">
        
        <!-- COLONNE 1 : SPINE (Liste des jours) -->
        <aside class="spine">
          <div class="spine-head">
            <div class="kicker">Corée du Sud</div>
            <div class="spine-title">15 jours</div>
            <div class="spine-dates">1 oct. — 15 oct. 2025</div>
          </div>
          
          <div class="spine-list">
            <!-- Ligne verticale de la timeline -->
            <div class="spine-line"></div>

            <!-- Jour Passé -->
            <button class="spine-day past">
              <div class="day-dot-wrapper"><div class="day-dot"></div></div>
              <div class="day-info">
                <div class="day-header">
                  <span class="day-n">J1</span>
                  <span class="day-city">Paris → Séoul</span>
                </div>
                <div class="day-date">Mer 1 oct.</div>
              </div>
            </button>

            <!-- Jour Actif (Aujourd'hui) -->
            <button class="spine-day active">
              <div class="day-dot-wrapper"><div class="day-dot"></div></div>
              <div class="day-info">
                <div class="day-header">
                  <span class="day-n">J6</span>
                  <span class="day-city">Excursion DMZ</span>
                </div>
                <div class="day-date">Lun 6 oct.</div>
              </div>
            </button>

            <!-- Jour Futur -->
            <button class="spine-day future">
              <div class="day-dot-wrapper"><div class="day-dot"></div></div>
              <div class="day-info">
                <div class="day-header">
                  <span class="day-n">J7</span>
                  <span class="day-city">Séoul → Busan</span>
                </div>
                <div class="day-date">Mar 7 oct.</div>
              </div>
            </button>
            
          </div>
        </aside>

        <!-- COLONNE 2 : DÉTAIL DU JOUR (À venir) -->
        <div class="detail" style="flex: 1; padding: 20px 24px;">
           <!-- Nous mettrons l'image Hero et les cartes d'étapes ici -->
        </div>

        <!-- COLONNE 3 : ÉLÉMENTS ÉPINGLÉS (À venir) -->
        <aside class="ctx" style="width: 304px; border-left: 1px solid var(--line); background: rgba(255,255,255,.35);">
           <!-- Nous mettrons la carte, la checklist et les stats ici -->
        </aside>

      </div>

      <!-- PANNEAU 2 : SYNTHÈSE (À venir) -->
      <div class="panel">
         <!-- Dashboard de synthèse -->
      </div>

    </div>
  </main>

</body>
</html>
