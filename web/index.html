
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Fabrique à Voyages — Planifie et suis ton voyage</title>
  <meta name="description" content="Construis ton itinéraire, suis ton budget, garde tes documents et voyage depuis le web ou l’application Android.">
  <meta name="theme-color" content="#15302a">

  <link rel="stylesheet" href="styles.css">
  <script>if(localStorage.getItem('it_theme')==='dark')document.documentElement.classList.add('dark')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
</head>
<body>

  <div id="root"></div>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 1 — Données brutes + état global (JS pur, pas Babel)
       ════════════════════════════════════════════════════════ -->
  <script src="views/trip-data.js"></script>
  <script src="views/image-slot.js"></script>
  <script src="lib/state.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 2 — Supabase (module ES, chargé en parallèle)
       ════════════════════════════════════════════════════════ -->
  <script type="module">
    import * as SB from './lib/supabase.js';
    window.SB = SB;

    const startApp = setInterval(() => {
      if (document.getElementById('root').innerHTML !== '') {
        clearInterval(startApp);
      } else {
        window.dispatchEvent(new Event('sb-ready'));
      }
    }, 250);
  </script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 3 — Atomes partagés (Icon, Btn, helpers)
       Dépendent de : React, Store
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="views/itin-shared.jsx"></script>
  <script type="text/babel" src="ui/Shared.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 4 — Utilitaires itinéraire + briques de base
       Dépendent de : Icon, Store
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="ui/itinerary-utils.js"></script>
  <script type="text/babel" src="ui/RailSection.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 5 — Widgets de la Toolbox
       Dépendent de : Store, Icon, SB, ItineraryUtils
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="ui/ChecklistWidget.js"></script>
  <script type="text/babel" src="ui/widgets/DayNotWidget.js"></script>
  <script type="text/babel" src="ui/widgets/GlobalNoteWidget.js"></script>
  <script type="text/babel" src="ui/widgets/CurrencyWidget.js"></script>
  <script type="text/babel" src="ui/widgets/DayScoreWidget.js"></script>
  <script type="text/babel" src="ui/widgets/CalendarWidget.js"></script>
  <script type="text/babel" src="ui/AroundStepWidget.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 6 — Composants métier (cards, éditeur, rails)
       Dépendent de : Couches 3-5
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="ui/StepCard.js"></script>
  <script type="text/babel" src="ui/StepEditor.js"></script>
  <script type="text/babel" src="ui/MealRail.js"></script>
  <script type="text/babel" src="ui/AccountModal.js"></script>
  <script type="text/babel" src="ui/Toolbox.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 7 — Vues principales
       Dépendent de : Couches 3-6
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="views/itin-atelier-v2.jsx"></script>
  <script type="text/babel" src="views/Itinerary.js"></script>
  <script type="text/babel" src="views/TravelMode.js"></script>
  <script type="text/babel" src="views/Map.js"></script>
  <script type="text/babel" src="views/Budget.js"></script>
  <script type="text/babel" src="views/Docs.js"></script>
  <script type="text/babel" src="views/Settings.js"></script>

  <!-- ════════════════════════════════════════════════════════
       COUCHE 8 — Shell + démarrage
       Dépend de : TOUT ce qui précède
       ════════════════════════════════════════════════════════ -->
  <script type="text/babel" src="ui/AppShell.js"></script>
  <script type="text/babel" src="app.js"></script>

</body>
</html>
