<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#15302a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Voyage Planner — L'Atelier</title>
  <link rel="manifest" href="manifest.json" />

  <!-- Polices DA Atelier -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root">
    <!-- Pendant que React monte -->
    <div class="boot">
      <div class="boot-mark">VP</div>
      <div class="boot-label">Chargement…</div>
    </div>
  </div>

  <!-- React 18 + ReactDOM via CDN (UMD, pas de build) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone pour transformer le JSX à la volée -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS (ESM) — chargé dans supabase.js -->

  <!-- Modules de l'app -->
  <!-- supabase.js est un module ES qui exporte sb, signIn, etc. -->
  <script type="module">
    // On expose Supabase sur window pour que les composants Babel-transformés y aient accès
    import * as SB from './js/lib/supabase.js';
    window.SB = SB;
    window.dispatchEvent(new CustomEvent('sb-ready'));
  </script>

  <!-- Tous les autres scripts sont du JSX, transformés par Babel -->
  <script type="text/babel" data-type="module" data-presets="react" src="js/lib/state.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/ui/Shared.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/views/Itinerary.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/views/Map.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/views/Budget.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/views/Docs.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/views/Settings.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="js/ui/AppShell.js"></script>
  <script type="text/babel" data-type="module" data-presets="react" src="app.js"></script>
</body>
</html>
