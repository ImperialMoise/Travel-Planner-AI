<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyage Planner - Atelier</title>
  
  <link rel="stylesheet" href="styles.css">
  <script>if(localStorage.getItem('it_theme')==='dark')document.documentElement.classList.add('dark')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
</head>
<body>
  
  <div id="root"></div>

  <script src="views/trip-data.js"></script>
  <script src="views/image-slot.js"></script>
  <script type="text/babel" src="views/itin-shared.jsx"></script>
  <script type="text/babel" src="views/itin-atelier-v2.jsx"></script>

  <script type="module">
    import * as SB from './lib/supabase.js';
    window.SB = SB;
    
    // Tire le signal de départ toutes les 250ms tant que l'app n'est pas affichée
    // (Cela compense le temps de chargement de la carte 3D !)
    const startApp = setInterval(() => {
      if (document.getElementById('root').innerHTML !== '') {
        clearInterval(startApp);
      } else {
        window.dispatchEvent(new Event('sb-ready'));
      }
    }, 250);
  </script>
  <script src="lib/state.js"></script>
  
  <script type="text/babel" src="ui/Shared.js"></script>
  
  <script type="text/babel" src="views/Itinerary.js"></script>
  <script type="text/babel" src="views/Map.js"></script>
  <script type="text/babel" src="views/Budget.js"></script>
  <script type="text/babel" src="views/Docs.js"></script>
  <script type="text/babel" src="views/Settings.js"></script>
  
  <script type="text/babel" src="ui/AppShell.js"></script>
  <script type="text/babel" src="app.js"></script>

</body>
</html>
