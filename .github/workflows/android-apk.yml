name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "web/lib/supabase.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        working-directory: mobile
        run: npm ci

      - name: Construire l’application mobile
        working-directory: mobile
        run: npm run build

      - name: Synchroniser Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Préparer la clé de signature
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Un ou plusieurs secrets Android sont manquants."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/la-fabrique-release.jks"

          test -s "$RUNNER_TEMP/la-fabrique-release.jks"

      - name: Construire l’APK release signé
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/la-fabrique-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Vérifier la signature de l’APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Publier l’artefact signé
        uses: actions/upload-artifact@v4
        with:
          name: la-fabrique-a-voyages-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Préparer le téléchargement public
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             la-fabrique-a-voyages.apk

          sha256sum la-fabrique-a-voyages.apk \
            > la-fabrique-a-voyages.apk.sha256

      - name: Publier la version Android signée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES="APK Android release signé automatiquement depuis le commit $GITHUB_SHA."

          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest \
              --title "La Fabrique à Voyages - Android" \
              --notes "$RELEASE_NOTES"

            gh release upload android-latest \
              la-fabrique-a-voyages.apk \
              la-fabrique-a-voyages.apk.sha256 \
              --clobber
          else
            gh release create android-latest \
              la-fabrique-a-voyages.apk \
              la-fabrique-a-voyages.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "La Fabrique à Voyages - Android" \
              --notes "$RELEASE_NOTES"
          fi